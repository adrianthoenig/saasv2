<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Landing Page</title>

    <!-- Styles -->
    <link rel="stylesheet" href="main.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <div class="header-logo">
                <img src="./img/branding/logo.png" alt="Whitespace logo" />
            </div>
            <div class="header-actions">
            <div class="header-buttons">
                <button class="btn btn-login">Login</button>
                <button class="btn btn-trial">Try Whitespace free <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="hamburger-menu"><i class="fa-solid fa-bars"></i></div>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <main class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-info">
                    <h1 class="hero-title">Get More Done with whitepace</h1>
                    <p class="hero-subtitle">
                        Project management software that enables your teams to collaborate, plan, analyze and manage everyday tasks
                    </p>
                </div>
                <button class="btn btn-hero-cta">Try TaskKey Free <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="hero-image"></div>
        </div>
    </main>
</body>
</html>
